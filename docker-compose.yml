# =====================================================================
#  Projet Big Data — Prédiction des réadmissions hospitalières (diabète)
#  Cluster distribué simulé avec Docker
#   - Stockage   : HDFS  = 1 NameNode + 2 DataNodes (réplication 2)
#   - Traitement : Spark = 1 master + 2 workers (mode standalone)
#   - Ingestion  : Kafka (KRaft, sans ZooKeeper) + Kafka UI + producteur
#   - Restitution: PostgreSQL (profil "restitution", livrables suivants)
#  Toutes les versions d'images sont fixées.
# =====================================================================

name: readmission

x-hadoop: &hadoop-base
  image: apache/hadoop:${HADOOP_VERSION:-3.4.2}
  user: root
  entrypoint: ["/bin/bash", "-c"]
  environment:
    HADOOP_HOME: /opt/hadoop
  volumes:
    - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  networks: [bigdata]
  restart: unless-stopped

x-spark: &spark-base
  image: readmission/spark:${SPARK_VERSION:-4.1.3}   # construite une seule fois par spark-master
  networks: [bigdata]
  restart: unless-stopped
  volumes:
    - ./streaming:/opt/app/streaming:ro
    - ./batch:/opt/app/batch:ro
    - ./data:/opt/app/data:ro
    - ./ingestion:/opt/app/ingestion:ro
    - ./infra/hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
    - ./infra/hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro

services:
  # ------------------------------------------------------------------ HDFS
  namenode:
    <<: *hadoop-base
    container_name: namenode
    hostname: namenode
    command:
      - |
        if [ ! -d /hadoop/dfs/name/current ]; then
          echo "Formatage du NameNode (premier demarrage)"
          /opt/hadoop/bin/hdfs namenode -format -force -nonInteractive -clusterId readmission-cluster
        fi
        exec /opt/hadoop/bin/hdfs namenode
    ports:
      - "${NAMENODE_UI_PORT:-9870}:9870"
    volumes:
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - namenode-data:/hadoop/dfs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9870' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  datanode1:
    <<: *hadoop-base
    container_name: datanode1
    hostname: datanode1
    command: ["exec /opt/hadoop/bin/hdfs datanode"]
    volumes:
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - datanode1-data:/hadoop/dfs
    depends_on:
      namenode: { condition: service_healthy }

  datanode2:
    <<: *hadoop-base
    container_name: datanode2
    hostname: datanode2
    command: ["exec /opt/hadoop/bin/hdfs datanode"]
    volumes:
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - datanode2-data:/hadoop/dfs
    depends_on:
      namenode: { condition: service_healthy }

  # ----------------------------------------------------------------- SPARK
  spark-master:
    <<: *spark-base
    build:
      context: ./infra/spark
      args:
        SPARK_IMAGE: apache/spark:${SPARK_VERSION:-4.1.3}-scala2.13-java17-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_APP_UI_PORT:-4040}:4040"   # UI des applications soumises depuis le master
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  spark-worker-1:
    <<: *spark-base
    pull_policy: never        # réutilise l'image locale construite par spark-master
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--webui-port", "8081"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_WORKER_DIR: /tmp/spark-work
    ports:
      - "${SPARK_WORKER1_UI_PORT:-18081}:8081"   # 18081 côté hôte : évite les ports déjà pris
    depends_on:
      spark-master: { condition: service_healthy }

  spark-worker-2:
    <<: *spark-base
    pull_policy: never        # réutilise l'image locale construite par spark-master
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--webui-port", "8082"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1536m}
      SPARK_WORKER_DIR: /tmp/spark-work
    ports:
      - "${SPARK_WORKER2_UI_PORT:-18082}:8082"   # 18082 côté hôte : évite les ports déjà pris
    depends_on:
      spark-master: { condition: service_healthy }

  # ----------------------------------------------------------------- KAFKA
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.2.2}
    container_name: kafka
    hostname: kafka
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "29092:29092"          # accès depuis l'hôte Windows (localhost:29092)
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [bigdata]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka-init:                   # crée les topics puis s'arrête
    image: apache/kafka:${KAFKA_VERSION:-4.2.2}
    container_name: kafka-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-hospital-discharges} --partitions ${KAFKA_PARTITIONS:-3} --replication-factor 1 \
          --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic ${KAFKA_TOPIC:-hospital-discharges}
    depends_on:
      kafka: { condition: service_healthy }
    networks: [bigdata]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: readmission
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka: { condition: service_healthy }
    networks: [bigdata]
    restart: unless-stopped

  # ------------------------------------------------------ PRODUCTEUR (ingestion)
  producer:
    build: ./ingestion
    image: readmission/producer:1.0
    container_name: producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DATA_FILE: /data/diabetic_data.csv
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hospital-discharges}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-20}
      MAX_EVENTS: ${MAX_EVENTS:-0}
      START_ROW: ${START_ROW:-0}
      LOOP: ${LOOP:-false}
    volumes:
      - ./data:/data:ro
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    networks: [bigdata]
    profiles: ["ingestion"]
    restart: "no"

  # ---------------------------------------------------- MONITORING (profil monitoring)
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    hostname: kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka: { condition: service_healthy }
    networks: [bigdata]
    profiles: ["monitoring"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - kafka-exporter
    networks: [bigdata]
    profiles: ["monitoring"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboard_pipeline.json:/etc/grafana/dashboards/pipeline.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [bigdata]
    profiles: ["monitoring"]
    restart: unless-stopped

  # ------------------------------------------- RESTITUTION (livrables suivants)
  postgres:
    image: postgres:16.6-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readmission}
      POSTGRES_USER: ${POSTGRES_USER:-readmission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [bigdata]
    profiles: ["restitution"]
    restart: unless-stopped

networks:
  bigdata:
    name: readmission-net

volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  kafka-data:
  postgres-data:
  prometheus-data:
  grafana-data:
