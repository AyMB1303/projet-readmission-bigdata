global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # Métriques du broker Kafka (exposées par kafka-exporter sur :9308)
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  # Métriques internes de Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
